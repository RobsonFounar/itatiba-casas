<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itatiba · Compare casas</title>
    <meta
      name="description"
      content="Compare casas em Itatiba pelo tempo de carro e a pé até o Colégio São José e o centro."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231a73e8' d='M16 2c-6.6 0-12 5.2-12 11.6 0 8.2 12 16.4 12 16.4s12-8.2 12-16.4C28 7.2 22.6 2 16 2zm0 16.2a4.6 4.6 0 1 1 0-9.2 4.6 4.6 0 0 1 0 9.2z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="auth-screen" class="auth-screen">
      <div class="auth-card" id="auth-card"></div>
    </div>

    <div id="app-shell" class="app-shell hidden">
      <div id="map" role="application" aria-label="Mapa de Itatiba"></div>

      <aside class="panel" id="panel">
        <header class="panel-head">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="22" height="22">
                <path
                  fill="currentColor"
                  d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"
                />
              </svg>
            </span>
            <div>
              <h1>Itatiba</h1>
              <p>Compare casas até o colégio e o centro</p>
            </div>
          </div>
          <button class="icon-btn" id="btn-menu" type="button" aria-label="Mais opções" title="Mais opções">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <circle cx="12" cy="5" r="1.7" fill="currentColor" />
              <circle cx="12" cy="12" r="1.7" fill="currentColor" />
              <circle cx="12" cy="19" r="1.7" fill="currentColor" />
            </svg>
          </button>
        </header>

        <div class="menu-pop hidden" id="menu-pop">
          <p class="menu-user" id="menu-user"></p>
          <button type="button" data-action="share">Compartilhar lista</button>
          <button type="button" data-action="shared-with-me" class="hidden" id="menu-shared">
            Listas compartilhadas
          </button>
          <button type="button" data-action="admin" class="hidden" id="menu-admin">
            Ver todas (admin)
          </button>
          <button type="button" data-action="mine" class="hidden" id="menu-mine">
            Minhas casas
          </button>
          <button type="button" data-action="migrate">Trazer casas deste navegador</button>
          <button type="button" data-action="export">Exportar dados</button>
          <button type="button" data-action="import">Importar dados</button>
          <button type="button" data-action="clear" class="danger">Apagar minhas casas</button>
          <button type="button" data-action="logout" class="danger">Sair</button>
        </div>
        <input type="file" id="import-file" accept="application/json" hidden />

        <div id="scope-bar" class="scope-bar hidden"></div>

        <section class="school-card" id="school-card"></section>

        <div class="panel-toolbar">
          <button class="primary-btn" id="btn-add" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
            Adicionar
          </button>
          <label class="sort-label">
            Ordenar
            <select id="sort-by">
              <option value="schoolDrive">Carro até o colégio</option>
              <option value="centroDrive">Carro até o centro</option>
              <option value="schoolWalk">A pé até o colégio</option>
              <option value="centroWalk">A pé até o centro</option>
              <option value="name">Nome</option>
            </select>
          </label>
        </div>

        <div class="panel-body" id="panel-body"></div>
        <p class="panel-credit">Feito por Robson Founar</p>
      </aside>

      <div class="map-hint" id="map-hint"></div>
      <div class="nav-banner hidden" id="nav-banner"></div>
    </div>

    <div class="toast hidden" id="toast" role="status"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/bairros.js?v=20260902-paineiras"></script>
    <script src="js/app.js?v=20260902-paineiras"></script>
  </body>
</html>
