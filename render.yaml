services:
  - type: web
    name: itatiba-casas
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - n8n/**

  # n8n self-hosted: UI, webhooks e workflows.
  # Plano free: o serviço dorme após 15 min sem tráfego e o Postgres
  # gratuito expira em 30 dias. Para produção, suba para starter / 1c-2g
  # no web e 0.1c-256mb no banco.
  - type: web
    name: n8n
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./n8n/Dockerfile
    dockerContext: ./n8n
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - n8n/**
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: GENERIC_TIMEZONE
        value: America/Sao_Paulo
      - key: TZ
        value: America/Sao_Paulo
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-db
          property: port
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password

databases:
  - name: n8n-db
    plan: free
    region: ohio
